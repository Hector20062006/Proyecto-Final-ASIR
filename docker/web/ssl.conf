<VirtualHost *:443>
    ServerName __DOMAIN_NAME__
    DocumentRoot /var/www/html

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/__DOMAIN_NAME__/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/__DOMAIN_NAME__/privkey.pem

    # Directorio para la validación de Certbot por si acaso
    Alias /.well-known/acme-challenge/ "/var/www/certbot/.well-known/acme-challenge/"
    <Directory "/var/www/certbot/">
        AllowOverride None
        Require all granted
    </Directory>

    <Directory /var/www/html>
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>