<VirtualHost *:443>
    ServerName parking-iliberis.run.place
    DocumentRoot /var/www/html

    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/parking.cer
    SSLCertificateKeyFile /etc/ssl/private/parking.key

    <Directory /var/www/html>
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>