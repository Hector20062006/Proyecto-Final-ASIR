<VirtualHost *:443>
    ServerName __DOMAIN_NAME__
    DocumentRoot /var/www/html

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/__DOMAIN_NAME__/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/__DOMAIN_NAME__/privkey.pem

    <Directory /var/www/html>
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>