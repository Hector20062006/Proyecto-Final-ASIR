name: Deploy en Raspberry Pi

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Actualizar código
        run: |
          cd ~/Proyecto-Final-ASIR
          git pull origin main

      - name: Redesplegar contenedores
        run: |
          cd ~/Proyecto-Final-ASIR
          docker compose up --build -d
          docker compose ps