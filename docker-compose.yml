version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: parking_ASIR
    volumes:
      - ./parking_asir.sql:/docker-entrypoint-initdb.d/init.sql
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      timeout: 10s
      retries: 5
      start_period: 30s

  web:
    build: 
      context: ./aplicacion-web
      dockerfile: ../docker/web/Dockerfile
    pull_policy: build
    container_name: web_php
    restart: always
    volumes:
      - ./aplicacion-web:/var/www/html
    ports:
      - "80:80"
    depends_on:
      db:
        condition: service_healthy

  python_app:
    build: 
      context: ./aplicacion-parking
      dockerfile: ../docker/python/Dockerfile
    pull_policy: build
    container_name: python_app
    restart: always
    privileged: true
    network_mode: host
    command: sh -c "echo '127.0.0.1 db' >> /etc/hosts && python program.py"
    group_add:
      - video
    depends_on:
      db:
        condition: service_healthy
    # Mapeo de dispositivos de hardware para la Raspberry Pi
    devices:
      - "/dev/ttyACM0:/dev/ttyACM0"  # Arduino
      - "/dev/video0:/dev/video0"    # Cámara 0 (Captura)
      - "/dev/video1:/dev/video1"    # Cámara 0 (Metadatos)
      - "/dev/video2:/dev/video2"    # Cámara 2 (Captura)
      - "/dev/video3:/dev/video3"    # Cámara 2 (Metadatos)

volumes:
  db_data:
