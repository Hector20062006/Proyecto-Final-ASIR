version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    volumes:
      - ./parking_asir.sql:/docker-entrypoint-initdb.d/init.sql
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD}"]
      timeout: 10s
      retries: 5
      start_period: 30s

  web:
    build: 
      context: .
      dockerfile: docker/web/Dockerfile
    pull_policy: build
    container_name: web_php
    restart: always
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - DB_HOST=${DB_HOST}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DOMAIN_NAME=${DOMAIN_NAME}
    volumes:
      - ./aplicacion-web:/var/www/html
      - certbot_conf:/etc/letsencrypt
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      db:
        condition: service_healthy

  certbot:
    image: certbot/dns-cloudflare
    container_name: certbot
    restart: always
    volumes:
      - certbot_conf:/etc/letsencrypt
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME}
      - CERTBOT_EMAIL=${CERTBOT_EMAIL}
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN}
    entrypoint: >
      /bin/sh -c '
      mkdir -p /secrets &&
      echo "dns_cloudflare_api_token = $${CLOUDFLARE_API_TOKEN}" > /secrets/cloudflare.ini &&
      chmod 600 /secrets/cloudflare.ini &&
      trap exit TERM;
      while :; do
        if [ -d "/etc/letsencrypt/live/$${DOMAIN_NAME}" ] && [ ! -L "/etc/letsencrypt/live/$${DOMAIN_NAME}/fullchain.pem" ]; then
          rm -rf "/etc/letsencrypt/live/$${DOMAIN_NAME}"
        fi
        certbot certonly --dns-cloudflare --dns-cloudflare-credentials /secrets/cloudflare.ini -d $${DOMAIN_NAME} --email $${CERTBOT_EMAIL} --agree-tos --no-eff-email --keep-until-expiring;
        sleep 12h & wait $${!};
      done;'

  python_app:
    build: 
      context: ./aplicacion-parking
      dockerfile: ../docker/python/Dockerfile
    pull_policy: build
    container_name: python_app
    restart: always
    privileged: true
    network_mode: host
    environment:
      - DB_HOST=${DB_HOST:-db}
      - DB_USER=${DB_USER:-root}
      - DB_PASSWORD=${DB_PASSWORD:-root}
      - DB_NAME=${DB_NAME:-parking_ASIR}
      - ARDUINO_PORT=${ARDUINO_PORT:-/dev/ttyACM0}
    command: sh -c "echo '127.0.0.1 db' >> /etc/hosts && python program.py"
    group_add:
      - video
    depends_on:
      db:
        condition: service_healthy
    # Al tener privileged: true, el contenedor ya tiene acceso a TODOS los dispositivos /dev
    # por lo que no es necesario mapear estáticamente devices: - "/dev/ttyACM0" etc,
    # permitiendo la autodetección dinámica en Python.

volumes:
  db_data:
  certbot_conf:
