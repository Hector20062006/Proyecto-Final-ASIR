version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    volumes:
      - ./parking_asir.sql:/docker-entrypoint-initdb.d/init.sql
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD}"]
      timeout: 10s
      retries: 5
      start_period: 30s

  web:
    build: 
      context: .
      dockerfile: docker/web/Dockerfile
    pull_policy: build
    container_name: web_php
    restart: always
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - DB_HOST=${DB_HOST}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DOMAIN_NAME=${DOMAIN_NAME}
    volumes:
      - ./aplicacion-web:/var/www/html
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      db:
        condition: service_healthy

  certbot:
    image: certbot/certbot
    container_name: certbot
    restart: always
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot certonly --webroot -w /var/www/certbot -d $${DOMAIN_NAME} --email $${CERTBOT_EMAIL} --agree-tos --no-eff-email --keep-until-expiring; sleep 12h & wait $${!}; done;'"

  python_app:
    build: 
      context: ./aplicacion-parking
      dockerfile: ../docker/python/Dockerfile
    pull_policy: build
    container_name: python_app
    restart: always
    privileged: true
    network_mode: host
    environment:
      - DB_HOST=${DB_HOST:-db}
      - DB_USER=${DB_USER:-root}
      - DB_PASSWORD=${DB_PASSWORD:-root}
      - DB_NAME=${DB_NAME:-parking_ASIR}
    command: sh -c "echo '127.0.0.1 db' >> /etc/hosts && python program.py"
    group_add:
      - video
    depends_on:
      db:
        condition: service_healthy
    # Mapeo de dispositivos de hardware para la Raspberry Pi
    devices:
      - "/dev/ttyACM0:/dev/ttyACM0"  # Arduino
      - "/dev/video0:/dev/video0"    # Cámara 0 (Captura)
      - "/dev/video1:/dev/video1"    # Cámara 0 (Metadatos)
      - "/dev/video2:/dev/video2"    # Cámara 2 (Captura)
      - "/dev/video3:/dev/video3"    # Cámara 2 (Metadatos)

volumes:
  db_data:
  certbot_conf:
  certbot_www:
